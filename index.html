// 時間変換
// ======================

function timeToMin(timeStr){

    if(!timeStr){
        return 0;
    }

    const [h,m] =
        timeStr.split(':').map(Number);

    return h * 60 + m;
}

// ======================
// スポット保存
// ======================

function saveSpot(area,spot){

    let spots =
        JSON.parse(localStorage.getItem('spots')) || [];

    const exists =
        spots.find(
            s =>
                s.area === area &&
                s.spot === spot
        );

    if(!exists){

        spots.push({ area, spot });

        localStorage.setItem(
            'spots',
            JSON.stringify(spots)
        );
    }

    loadSpotList();
}

// ======================
// スポット読込
// ======================

function loadSpotList(){

    const areaList =
        document.getElementById('areaList');

    const spotList =
        document.getElementById('spotList');

    areaList.innerHTML = '';
    spotList.innerHTML = '';

    const spots =
        JSON.parse(localStorage.getItem('spots')) || [];

    const areas =
        [...new Set(spots.map(s => s.area))];

    areas.forEach(a => {

        const option =
            document.createElement('option');

        option.value = a;

        areaList.appendChild(option);
    });

    spots.forEach(s => {

        const option =
            document.createElement('option');

            option.value = s.spot;

        spotList.appendChild(option);
    });
}

// ======================
// 魚種保存
// ======================

function saveFishName(name){

    let fishes =
        JSON.parse(localStorage.getItem('fishNames')) || [];

    if(!fishes.includes(name)){

        fishes.push(name);

        localStorage.setItem(
            'fishNames',
            JSON.stringify(fishes)
        );
    }

    loadFishList();
    loadGraphFishList();
}

// ======================
// 魚種読込
// ======================

function loadFishList(){

    const fishList =
        document.getElementById('fishList');

    fishList.innerHTML = '';

    const fishes =
        JSON.parse(localStorage.getItem('fishNames')) || [];

    fishes.forEach(f => {

        const option =
            document.createElement('option');

        option.value = f;

        fishList.appendChild(option);
    });
}

// ======================
// グラフ魚種
// ======================

function loadGraphFishList(){

    const select =
        document.getElementById('graphFish');

    const currentValue =
        select.value;

    select.innerHTML =
        '<option value="">選択してください</option>';

    const fishes =
        JSON.parse(localStorage.getItem('fishNames')) || [];

    fishes.forEach(f => {

        const option =
            document.createElement('option');

        option.value = f;
        option.textContent = f;

        select.appendChild(option);
    });

    select.value = currentValue;
}

// ======================
// 潮保存
// ======================

function saveTideDay(){

    const date =
        document.getElementById('tideDate').value;

    const tideType =
        document.getElementById('dayTideType').value;

    const area =
        document.getElementById('areaInput').value;

    const spot =
        document.getElementById('spotInput').value;

    if(!date || !area || !spot){

        alert('入力してください');

        return;
    }

    saveSpot(area,spot);

    const rows =
        document.querySelectorAll('#tideTable tr');

    const tides = [];

    rows.forEach(row => {

        const type =
            row.querySelector('select').value;

        const time =
            row.querySelector('input').value;

        if(time){

            tides.push({
                type,
                time
            });
        }
    });

    tides.sort(
        (a,b)=>
            timeToMin(a.time)
            - timeToMin(b.time)
    );

    localStorage.setItem(
        'currentTide',
        JSON.stringify({
            date,
            tideType,
            area,
            spot,
            tides
        })
    );

    alert('潮を保存しました');
}

// ======================
// 潮復元
// ======================

function restoreCurrentTide(){

    const current =
        JSON.parse(
            localStorage.getItem('currentTide')
        );

    if(!current){
        return;
    }

    document.getElementById('tideDate').value =
        current.date;

    document.getElementById('dayTideType').value =
        current.tideType || '中潮';

    document.getElementById('areaInput').value =
        current.area;

    document.getElementById('spotInput').value =
        current.spot;

    const rows =
        document.querySelectorAll('#tideTable tr');

    rows.forEach(row => {
        row.querySelector('input').value = '';
    });

    current.tides.forEach((tide,index)=>{

        if(rows[index]){

            rows[index]
                .querySelector('select')
                .value = tide.type;

            rows[index]
                .querySelector('input')
                .value = tide.time;
        }
    });
}

// ======================
// 12分率
// ======================

function calcTideLabel(prev,next,fishMin){

    let prevMin =
        timeToMin(prev.time);

    let nextMin =
        timeToMin(next.time);

    if(nextMin < prevMin){
        nextMin += 1440;
    }

    let targetMin = fishMin;

    if(targetMin < prevMin){
        targetMin += 1440;
    }

    const total =
        nextMin - prevMin;

    const elapsed =
        targetMin - prevMin;

    const progress =
        elapsed / total;

    const weights = [1,2,3,3,2,1];

    let currentWeight = 0;
    let phase = 0;

    for(let i=0;i<weights.length;i++){

        const section =
            weights[i] / 12;

        if(progress < currentWeight + section){

            const localRatio =
                (progress - currentWeight)
                / section;

            phase =
                (i + localRatio)
                / 6;

            break;
        }

        currentWeight += section;
    }

    let tideLevel =
        Math.floor(phase * 10);

    if(tideLevel < 0){
        tideLevel = 0;
    }

    if(tideLevel > 10){
        tideLevel = 10;
    }

    if(prev.type === '満潮'){

        const remain =
            10 - tideLevel;

        if(remain <= 0 || remain >= 10){
            return '潮止まり';
        }

        return `下げ${remain}分`;
    }

    else{

        if(tideLevel <= 0 || tideLevel >= 10){
            return '潮止まり';
        }

        return `上げ${tideLevel}分`;
    }
}

// ======================
// 釣果保存
// ======================

function saveFish(){

    const current =
        JSON.parse(
            localStorage.getItem('currentTide')
        );

    if(
        !current ||
        !current.tides ||
        current.tides.length < 2
    ){
        alert('先に潮を登録してください');
        return;
    }

    const fishTime =
        document.getElementById('fishTime').value;

    const fishName =
        document.getElementById('fishName').value;

    const fishSize =
        document.getElementById('fishSize').value;

    if(!fishTime || !fishName){

        alert('入力してください');

        return;
    }

    saveFishName(fishName);

    const fishMin =
        timeToMin(fishTime);

    const tides =
        [...current.tides].sort(
            (a,b)=>
                timeToMin(a.time)
                - timeToMin(b.time)
        );

    let tideLabel = '判定不可';

    for(let i=0;i<tides.length-1;i++){

        let start =
            timeToMin(tides[i].time);

        let end =
            timeToMin(tides[i+1].time);

        let target = fishMin;

        if(end < start){
            end += 1440;
        }

        if(target < start){
            target += 1440;
        }

        if(
            target >= start &&
            target <= end
        ){

            tideLabel =
                calcTideLabel(
                    tides[i],
                    tides[i+1],
                    fishMin
                );

            break;
        }
    }

    let records =
        JSON.parse(
            localStorage.getItem('fishRecords')
        ) || [];

    records.push({

        date: current.date,
        tideType: current.tideType,

        area: current.area,
        spot: current.spot,

        fish: fishName,
        size: fishSize,

        time: fishTime,
        tide: tideLabel
    });

    localStorage.setItem(
        'fishRecords',
        JSON.stringify(records)
    );

    loadFish();
    drawGraph();

    document.getElementById('fishTime').value = '';
    document.getElementById('fishSize').value = '';
}

// ======================
// 削除
// ======================

function deleteFish(index){

    if(!confirm('削除しますか？')){
        return;
    }

    let records =
        JSON.parse(
            localStorage.getItem('fishRecords')
        ) || [];

    records.splice(index,1);

    localStorage.setItem(
        'fishRecords',
        JSON.stringify(records)
    );

    loadFish();
    drawGraph();
}

// ======================
// 一覧
// ======================

function loadFish(){

    const body =
        document.getElementById('fishBody');

    body.innerHTML = '';

    const records =
        JSON.parse(
            localStorage.getItem('fishRecords')
        ) || [];

    [...records]
        .reverse()
        .slice(0,50)
        .forEach((r,reverseIndex)=>{

        const index =
            records.length - 1 - reverseIndex;

        const tr =
            document.createElement('tr');

        tr.innerHTML = `
            <td>${r.time}</td>
            <td>${r.fish}</td>
            <td>${r.size || '-'}</td>
            <td>${r.tide}</td>
            <td>${r.tideType || '-'}</td>
            <td>
                <button
                    class="delete-btn"
                    onclick="deleteFish(${index})"
                >
                    ❌
                </button>
            </td>
        `;

        body.appendChild(tr);
    });

    createSummary(records);
}

// ======================
// 集計
// ======================

function createSummary(records){

    const area =
        document.getElementById('summaryArea');

    area.innerHTML = '';

    const grouped = {};

    records.forEach(r => {

        const key =
            `${r.area} / ${r.spot} / ${r.fish}`;

        if(!grouped[key]){
            grouped[key] = {};
        }

        if(!grouped[key][r.tide]){
            grouped[key][r.tide] = 0;
        }

        grouped[key][r.tide]++;
    });

    for(const key in grouped){

        const title =
            document.createElement('h3');

        title.className = 'section-title';
        title.textContent = key;

        area.appendChild(title);

        const table =
            document.createElement('table');

        table.innerHTML = `
            <thead>
                <tr>
                    <th>潮</th>
                    <th>件数</th>
                </tr>
            </thead>
        `;

        const tbody =
            document.createElement('tbody');

        const tides =
            grouped[key];

        for(const tide in tides){

            const tr =
                document.createElement('tr');

            if(
                tide === '上げ3分' ||
                tide === '下げ7分'
            ){
                tr.className = 'good';
            }

            tr.innerHTML = `
                <td>${tide}</td>
                <td>${tides[tide]}</td>
            `;

            tbody.appendChild(tr);
        }

        table.appendChild(tbody);

        area.appendChild(table);
    }
}

// ======================
// グラフ
// ======================

function drawGraph(){

    const fish =
        document.getElementById('graphFish').value;

    const canvas =
        document.getElementById('graphCanvas');

    const ctx =
        canvas.getContext('2d');

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(!fish){
        return;
    }

    const records =
        JSON.parse(
            localStorage.getItem('fishRecords')
        ) || [];

    const levels = [
        1,2,3,4,5,6,7,8,9
    ];

    const riseCounts = {};
    const fallCounts = {};

    levels.forEach(level => {

        riseCounts[level] = 0;
        fallCounts[level] = 0;
    });

    records.forEach(r => {

        if(r.fish !== fish){
            return;
        }

        if(r.tide.includes('上げ')){

            const num =
                Number(
                    r.tide
                        .replace('上げ','')
                        .replace('分','')
                );

            if(riseCounts[num] !== undefined){
                riseCounts[num]++;
            }
        }

        if(r.tide.includes('下げ')){

            const num =
                Number(
                    r.tide
                        .replace('下げ','')
                        .replace('分','')
                );

            const level =
                10 - num;

            if(fallCounts[level] !== undefined){
                fallCounts[level]++;
            }
        }
    });

    const allValues = [];

    levels.forEach(level => {

        allValues.push(
            riseCounts[level]
        );

        allValues.push(
            fallCounts[level]
        );
    });

    const max =
        Math.max(...allValues,1);

    const startX = 60;
    const baseY = 260;

    const groupWidth = 60;

    const barWidth = 18;

    const graphHeight = 180;

    ctx.font = '16px sans-serif';

    ctx.fillStyle = '#000';

    ctx.fillText(
        `${fish} 潮位別ヒット`,
        20,
        25
    );

    ctx.beginPath();

    ctx.moveTo(startX,40);

    ctx.lineTo(startX,baseY);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(startX,baseY);

    ctx.lineTo(650,baseY);

    ctx.stroke();

    levels.forEach((level,index)=>{

        const rise =
            riseCounts[level];

        const fall =
            fallCounts[level];

        const riseHeight =
            (rise / max)
            * graphHeight;

        const fallHeight =
            (fall / max)
            * graphHeight;

        const x =
            startX + 20 + index * groupWidth;

        // 上げ
        ctx.fillStyle = '#3182ce';

        ctx.fillRect(
            x,
            baseY - riseHeight,
            barWidth,
            riseHeight
        );

        // 下げ
        ctx.fillStyle = '#dd6b20';

        ctx.fillRect(
            x + 22,
            baseY - fallHeight,
            barWidth,
            fallHeight
        );

        ctx.fillStyle = '#000';

        ctx.font = '11px sans-serif';

        ctx.fillText(
            rise,
            x,
            baseY - riseHeight - 5
        );

        ctx.fillText(
            fall,
            x + 22,
            baseY - fallHeight - 5
        );

        ctx.fillText(
            level,
            x + 10,
            baseY + 20
        );
    });

    // 凡例
    ctx.fillStyle = '#3182ce';

    ctx.fillRect(500,20,15,15);

    ctx.fillStyle = '#000';

    ctx.fillText(
        '上げ',
        520,
        32
    );

    ctx.fillStyle = '#dd6b20';

    ctx.fillRect(570,20,15,15);

    ctx.fillStyle = '#000';

    ctx.fillText(
        '下げ',
        590,
        32
    );

    ctx.fillText(
        '潮位',
        20,
        baseY + 20
    );
}

// ======================
// エクスポート
// ======================

function exportData(){

    const data = {

        currentTide:
            JSON.parse(
                localStorage.getItem('currentTide')
            ),

        fishRecords:
            JSON.parse(
                localStorage.getItem('fishRecords')
            ) || [],

        fishNames:
            JSON.parse(
                localStorage.getItem('fishNames')
            ) || [],

        spots:
            JSON.parse(
                localStorage.getItem('spots')
            ) || []
    };

    const blob =
        new Blob(
            [
                JSON.stringify(data,null,2)
            ],
            {
                type:'application/json'
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement('a');

    const today =
        new Date()
            .toISOString()
            .slice(0,10);

    a.href = url;

    a.download =
        `tide_backup_${today}.json`;

    a.click();

    URL.revokeObjectURL(url);
}

function importData(){

    const file =
        document.getElementById('importFile')
        .files[0];

    if(!file){

        alert('ファイルを選択してください');

        return;
    }

    const reader =
        new FileReader();

    reader.onload = function(e){

        try{

            const data =
                JSON.parse(e.target.result);

            if(data.currentTide){

                localStorage.setItem(
                    'currentTide',
                    JSON.stringify(data.currentTide)
                );
            }

            if(data.fishRecords){

                localStorage.setItem(
                    'fishRecords',
                    JSON.stringify(data.fishRecords)
                );
            }

            if(data.fishNames){

                localStorage.setItem(
                    'fishNames',
                    JSON.stringify(data.fishNames)
                );
            }

            if(data.spots){

                localStorage.setItem(
                    'spots',
                    JSON.stringify(data.spots)
                );
            }

            alert('復元しました');

            location.reload();

        }catch(error){

            alert('復元に失敗しました');
        }
    };

    reader.readAsText(file);
}

// ======================
// 起動時
// ======================

restoreCurrentTide();
loadFish();
loadSpotList();
loadFishList();
loadGraphFishList();

				</script>
