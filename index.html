// 時間変換
// ======================

function timeToMin(timeStr){

    if(!timeStr){
        return 0;
    }

    const [h,m] =
        timeStr.split(':').map(Number);

    return h * 60 + m;
}

// ======================
// スポット保存
// ======================

function saveSpot(spot){

    let spots =
        JSON.parse(
            localStorage.getItem('spots')
        ) || [];

    const exists =
        spots.find(
            s =>
                s.area === area &&
                s.spot === spot
        );

    if(!exists){

        spots.push({
            spot
        });

        localStorage.setItem(
            'spots',
            JSON.stringify(spots)
        );
    }

    loadSpotList();
}

// ======================
// スポット読込
// ======================

function loadSpotList(){

    const areaList =
        document.getElementById('areaList');

    const spotList =
        document.getElementById('spotList');

    areaList.innerHTML = '';
    spotList.innerHTML = '';

    const spots =
        JSON.parse(
            localStorage.getItem('spots')
        ) || [];

    const areas =
        [...new Set(
            spots.map(s => s.area)
        )];

    areas.forEach(a => {

        const option =
            document.createElement('option');

        option.value = a;

        areaList.appendChild(option);
    });

    spots.forEach(s => {

        const option =
            document.createElement('option');

        option.value = s.spot;

        spotList.appendChild(option);
    });
}

function saveTideDay(){

    const date =
        document.getElementById('tideDate').value;

    const tideType =
        document.getElementById('dayTideType').value;



    const spot =
        document.getElementById('spotInput').value;

if(!date || !spot)

        alert('入力してください');

        return;
    }

	saveSpot(spot);

    const rows =
        document.querySelectorAll('#tideTable tr');

    const tides = [];

    rows.forEach(row => {

        const type =
            row.querySelector('select').value;

        const time =
            row.querySelector('input').value;

        if(time){

            tides.push({
                type,
                time
            });
        }
    });

    tides.sort(
        (a,b)=>
            timeToMin(a.time)
            - timeToMin(b.time)
    );

    localStorage.setItem(
        'currentTide',
        JSON.stringify({
            date,
            tideType,
           
            spot,
            tides
        })
    );

    alert('潮を保存しました');
}

function restoreCurrentTide(){

    const current =
        JSON.parse(
            localStorage.getItem('currentTide')
        );

    if(!current){
        return;
    }

    document.getElementById('tideDate').value =
        current.date;

    document.getElementById('dayTideType').value =
        current.tideType || '中潮';

    document.getElementById('areaInput').value =
        current.area;

    document.getElementById('spotInput').value =
        current.spot;

    const rows =
        document.querySelectorAll('#tideTable tr');

    rows.forEach(row => {

        row.querySelector('input').value = '';
    });

    current.tides.forEach((tide,index)=>{

        if(rows[index]){

            rows[index]
                .querySelector('select')
                .value = tide.type;

            rows[index]
                .querySelector('input')
                .value = tide.time;
        }
    });
}

// ======================
// 12分率
// ======================

function calcTideLabel(prev,next,fishMin){

    let prevMin =
        timeToMin(prev.time);

    let nextMin =
        timeToMin(next.time);

    if(nextMin < prevMin){
        nextMin += 1440;
    }

    let targetMin = fishMin;

    if(targetMin < prevMin){
        targetMin += 1440;
    }

    const total =
        nextMin - prevMin;

    const elapsed =
        targetMin - prevMin;

    let progress =
        elapsed / total;

    if(progress < 0){
        progress = 0;
    }

    if(progress > 1){
        progress = 1;
    }

    const weights = [1,2,3,3,2,1];

    let currentWeight = 0;

    let phase = 1;

    for(let i=0;i<weights.length;i++){

        const section =
            weights[i] / 12;

        if(progress <= currentWeight + section){

            const localRatio =
                (progress - currentWeight)
                / section;

            phase =
                (i + localRatio)
                / 6;

            break;
        }

        currentWeight += section;
    }

    let tideLevel =
        Math.floor(phase * 10);

    if(tideLevel < 1){
        tideLevel = 1;
    }

    if(tideLevel > 9){
        tideLevel = 9;
    }

    if(prev.type === '満潮'){

        const remain =
            10 - tideLevel;

        return `下げ${remain}分`;
    }

    else{

        return `上げ${tideLevel}分`;
    }
}

// ======================
// 釣果保存
// ======================

function saveFish(){

    const current =
        JSON.parse(
            localStorage.getItem('currentTide')
        );

    if(
        !current ||
        !current.tides ||
        current.tides.length < 2
    ){
        alert('先に潮を登録してください');
        return;
    }

    const fishTime =
        document.getElementById('fishTime').value;



    const fishSize =
        document.getElementById('fishSize').value;

    if(!fishTime)

        alert('入力してください');

        return;
    }

    

    const fishMin =
        timeToMin(fishTime);

    const tides =
        [...current.tides].sort(
            (a,b)=>
                timeToMin(a.time)
                - timeToMin(b.time)
        );

    let tideLabel = '判定不可';

    for(let i=0;i<tides.length-1;i++){

        let start =
            timeToMin(tides[i].time);

        let end =
            timeToMin(tides[i+1].time);

        let target = fishMin;

        if(end < start){
            end += 1440;
        }

        if(target < start){
            target += 1440;
        }

        if(
            target >= start &&
            target <= end
        ){

            tideLabel =
                calcTideLabel(
                    tides[i],
                    tides[i+1],
                    fishMin
                );

            break;
        }
    }

    let records =
        JSON.parse(
            localStorage.getItem('fishRecords')
        ) || [];

    records.push({

        date: current.date,

        tideType: current.tideType,

    

        spot: current.spot,


        size: fishSize,

        time: fishTime,

        tide: tideLabel
    });

    localStorage.setItem(
        'fishRecords',
        JSON.stringify(records)
    );

    loadFish();

    drawGraph();

    document.getElementById('fishTime').value = '';

    document.getElementById('fishSize').value = '';
}

// ======================
// 削除
// ======================

function deleteFish(index){

    if(!confirm('削除しますか？')){
        return;
    }

    let records =
        JSON.parse(
            localStorage.getItem('fishRecords')
        ) || [];

    records.splice(index,1);

    localStorage.setItem(
        'fishRecords',
        JSON.stringify(records)
    );

    loadFish();

    drawGraph();
}

// ======================
// 一覧
// ======================

function loadFish(){

    const body =
        document.getElementById('fishBody');

    body.innerHTML = '';

    const records =
        JSON.parse(
            localStorage.getItem('fishRecords')
        ) || [];

    [...records]
        .reverse()
        .slice(0,50)
        .forEach((r,reverseIndex)=>{

        const index =
            records.length - 1 - reverseIndex;

        const tr =
            document.createElement('tr');

        tr.innerHTML = `
            <td>${r.date}</td>
            <td>${r.time}</td>
            <td>${r.fish}</td>
            <td>${r.size || '-'}</td>
            <td>${r.tide}</td>
            <td>${r.tideType || '-'}</td>
            <td>
                <button
                    class="delete-btn"
                    onclick="deleteFish(${index})"
                >
                    ❌
                </button>
            </td>
        `;

        body.appendChild(tr);
    });

    createSummary(records);
}

// ======================
// 集計
// ======================

function createSummary(records){

    const area =
        document.getElementById('summaryArea');

    area.innerHTML = '';

    const grouped = {};

    records.forEach(r => {

        const key =
            `${r.area} / ${r.spot} / ${r.fish}`;

        if(!grouped[key]){
            grouped[key] = {};
        }

        if(!grouped[key][r.tide]){
            grouped[key][r.tide] = 0;
        }

        grouped[key][r.tide]++;
    });

    for(const key in grouped){

        const title =
            document.createElement('h3');

        title.className = 'section-title';

        title.textContent = key;

        area.appendChild(title);

        const table =
            document.createElement('table');

        table.innerHTML = `
            <thead>
                <tr>
                    <th>潮</th>
                    <th>件数</th>
                </tr>
            </thead>
        `;

        const tbody =
            document.createElement('tbody');

        const tides =
            grouped[key];

        for(const tide in tides){

            const tr =
                document.createElement('tr');

            if(
                tide === '上げ3分' ||
                tide === '下げ7分'
            ){
                tr.className = 'good';
            }

            tr.innerHTML = `
                <td>${tide}</td>
                <td>${tides[tide]}</td>
            `;

            tbody.appendChild(tr);
        }

        table.appendChild(tbody);

        area.appendChild(table);
    }
}

// ======================
// グラフ
// ======================

function drawGraph(){

    const fish =
        document.getElementById('graphFish').value;

    const canvas =
        document.getElementById('graphCanvas');

    const ctx =
        canvas.getContext('2d');

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(!fish){
        return;
    }

    const records =
        JSON.parse(
            localStorage.getItem('fishRecords')
        ) || [];

    const labels = [

        '上げ1分 / 下げ9分',
        '上げ2分 / 下げ8分',
        '上げ3分 / 下げ7分',
        '上げ4分 / 下げ6分',
        '上げ5分 / 下げ5分',
        '上げ6分 / 下げ4分',
        '上げ7分 / 下げ3分',
        '上げ8分 / 下げ2分',
        '上げ9分 / 下げ1分'
    ];

    const riseCounts = [
        0,0,0,0,0,0,0,0,0
    ];

    const fallCounts = [
        0,0,0,0,0,0,0,0,0
    ];

    records.forEach(r => {

        if(r.fish !== fish){
            return;
        }

        if(r.tide.includes('上げ')){

            const num =
                Number(
                    r.tide
                        .replace('上げ','')
                        .replace('分','')
                );

            if(num >= 1 && num <= 9){

                const index =
                    num - 1;

                riseCounts[index]++;
            }
        }

        if(r.tide.includes('下げ')){

            const num =
                Number(
                    r.tide
                        .replace('下げ','')
                        .replace('分','')
                );

            if(num >= 1 && num <= 9){

                const index =
                    9 - num;

                fallCounts[index]++;
            }
        }
    });

    const allValues = [
        ...riseCounts,
        ...fallCounts
    ];

    const max =
        Math.max(...allValues,1);

    const startX = 90;

    const baseY = 320;

    const graphHeight = 170;

    const groupWidth = 82;

    const barWidth = 22;

    // タイトル
    ctx.fillStyle = '#000';

    ctx.font = '20px sans-serif';

    ctx.fillText(
        `${fish} 潮位帯分析`,
        20,
        45
    );

    // 凡例
    ctx.fillStyle = '#4c6ef5';

    ctx.fillRect(
        120,
        60,
        20,
        20
    );

    ctx.fillStyle = '#000';

    ctx.font = '14px sans-serif';

    ctx.fillText(
        '上げ潮（干潮→満潮）',
        150,
        75
    );

    ctx.fillStyle = '#f0c419';

    ctx.fillRect(
        380,
        60,
        20,
        20
    );

    ctx.fillStyle = '#000';

    ctx.fillText(
        '下げ潮（満潮→干潮）',
        410,
        75
    );

    // Y軸
    ctx.beginPath();

    ctx.moveTo(startX,100);

    ctx.lineTo(startX,baseY);

    ctx.stroke();

    // X軸
    ctx.beginPath();

    ctx.moveTo(startX,baseY);

    ctx.lineTo(850,baseY);

    ctx.stroke();

    // Y目盛
    ctx.font = '12px sans-serif';

    for(let i=0;i<=max;i++){

        const y =
            baseY -
            (i / max) * graphHeight;

        ctx.fillText(
            i,
            55,
            y + 5
        );

        ctx.strokeStyle = '#ddd';

        ctx.beginPath();

        ctx.moveTo(startX,y);

        ctx.lineTo(850,y);

        ctx.stroke();
    }

    // 棒グラフ
    labels.forEach((label,index)=>{

        const rise =
            riseCounts[index];

        const fall =
            fallCounts[index];

        const riseHeight =
            (rise / max)
            * graphHeight;

        const fallHeight =
            (fall / max)
            * graphHeight;

        const x =
            startX +
            25 +
            index * groupWidth;

        // 上げ
        ctx.fillStyle = '#4c6ef5';

        ctx.fillRect(
            x,
            baseY - riseHeight,
            barWidth,
            riseHeight
        );

        // 下げ
        ctx.fillStyle = '#f0c419';

        ctx.fillRect(
            x + 28,
            baseY - fallHeight,
            barWidth,
            fallHeight
        );

        // 数字
        ctx.fillStyle = '#000';

        ctx.font = '11px sans-serif';

        ctx.fillText(
            rise,
            x,
            baseY - riseHeight - 5
        );

        ctx.fillText(
            fall,
            x + 28,
            baseY - fallHeight - 5
        );

        // ラベル
        ctx.save();

        ctx.translate(
            x + 5,
            baseY + 40
        );

        ctx.rotate(
            -Math.PI / 4
        );

        ctx.font = '11px sans-serif';

        ctx.fillText(
            label,
            0,
            0
        );

        ctx.restore();
    });
}
