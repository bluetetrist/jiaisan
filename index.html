<!doctype html><html><head></head><body><!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>潮時合データベース</title>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: #f4f6f9;
			margin: 0;
			padding: 15px;
			color: #333;
		}

		.card {
			background: #fff;
			border-radius: 12px;
			padding: 20px;
			margin-bottom: 15px;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
		}

		h2 {
			margin-top: 0;
			color: #1a365d;
		}

		.input-group {
			margin-bottom: 12px;
		}

		label {
			display: block;
			font-size: 13px;
			font-weight: bold;
			margin-bottom: 5px;
		}

		input,
		select {
			width: 100%;
			padding: 10px;
			border: 1px solid #ccc;
			border-radius: 6px;
			box-sizing: border-box;
			font-size: 16px;
		}

		button {
			width: 100%;
			padding: 12px;
			border: none;
			border-radius: 6px;
			background: #2b6cb0;
			color: #fff;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
			margin-top: 10px;
		}

		button:active {
			background: #2c5282;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 10px;
		}

		th,
		td {
			border: 1px solid #ddd;
			padding: 8px;
			text-align: center;
			font-size: 14px;
		}

		th {
			background: #f7fafc;
		}

		.good {
			background: #fff7e6;
			font-weight: bold;
			color: #dd6b20;
		}

		.section-title {
			margin-top: 25px;
		}

		.delete-btn {
			background: #e53e3e;
			padding: 6px 10px;
			font-size: 12px;
			margin: 0;
			width: auto;
		}

		canvas {
			width: 100%;
			max-width: 100%;
			background: #fff;
			border: 1px solid #ddd;
			border-radius: 8px;
			margin-top: 15px;
		}
	</style>
</head>

<body>

	<div class="card">
		<h2>今日の潮</h2>
		<div class="input-group">
			<label>日付</label>
			<input type="date" id="tideDate">
</div>
			<div class="input-group">
				<label>潮回り</label>
				<select id="dayTideType">
<option>大潮</option>
<option>中潮</option>
<option>小潮</option>
<option>長潮</option>
<option>若潮</option>
</select>
			</div>
			<div class="input-group">
				<label>エリア</label>
				<input type="text" id="areaInput" list="areaList">
				<datalist id="areaList"></datalist>
			</div>
			<div class="input-group">
				<label>スポット</label>
				<input type="text" id="spotInput" list="spotList">
				<datalist id="spotList"></datalist>
			</div>
			<table>
				<thead>
					<tr>
						<th>種類</th>
						<th>時間</th>
					</tr>
				</thead>
				<tbody id="tideTable">
					<tr>
						<td>
							<select>
<option value="満潮">満潮</option>
<option value="干潮">干潮</option>
</select>
						</td>
						<td><input type="time"></td>
					</tr>
					<tr>
						<td>
							<select>
<option value="干潮">干潮</option>
<option value="満潮">満潮</option>
</select>
						</td>
						<td><input type="time"></td>
					</tr>
					<tr>
						<td>
							<select>
<option value="満潮">満潮</option>
<option value="干潮">干潮</option>
</select>
						</td>
						<td><input type="time"></td>
					</tr>
					<tr>
						<td>
							<select>
<option value="干潮">干潮</option>
<option value="満潮">満潮</option>
</select>
						</td>
						<td><input type="time"></td>
					</tr>
				</tbody>
			</table>
			<button onclick="saveTideDay()">潮を保存</button>
		</div>

		<div class="card">
			<h2>釣果登録</h2>
			<div class="input-group">
				<label>釣れた時間</label>
				<input type="time" id="fishTime">
</div>
				<div class="input-group">
					<label>魚種</label>
					<input type="text" id="fishName" list="fishList">
					<datalist id="fishList"></datalist>
				</div>
				<div class="input-group">
					<label>サイズ（cm・任意）</label>
					<input type="number" id="fishSize">
</div>
					<button onclick="saveFish()">釣果を追加</button>
				</div>

				<div class="card">
					<h2>釣果一覧（最新50件）</h2>
					<table>
						<thead>
							<tr>
								<th>時間</th>
								<th>魚</th>
								<th>サイズ</th>
								<th>潮</th>
								<th>潮回り</th>
								<th>削除</th>
							</tr>
						</thead>
						<tbody id="fishBody"></tbody>
					</table>
				</div>

				<div class="card">
					<h2>魚種別 時合集計</h2>
					<div id="summaryArea"></div>
				</div>

				<div class="card">
					<h2>魚種別グラフ</h2>
					<div class="input-group">
						<label>魚種</label>
						<select id="graphFish" onchange="drawGraph()">
<option value="">選択してください</option>
</select>
					</div>
					<canvas id="graphCanvas" width="750" height="320"></canvas>
				</div>

				<script>
					// 時間変換
function timeToMin(timeStr){
    if(!timeStr) return 0;
    const [h,m] = timeStr.split(':').map(Number);
    return h * 60 + m;
}

// スポット保存
function saveSpot(area,spot){
    let spots = JSON.parse(localStorage.getItem('spots')) || [];
    const exists = spots.find(s => s.area === area && s.spot === spot);
    if(!exists){
        spots.push({ area, spot });
        localStorage.setItem('spots', JSON.stringify(spots));
    }
    loadSpotList();
}

// スポット読込
function loadSpotList(){
    const areaList = document.getElementById('areaList');
    const spotList = document.getElementById('spotList');
    areaList.innerHTML = '';
    spotList.innerHTML = '';
    const spots = JSON.parse(localStorage.getItem('spots')) || [];
    const areas = [...new Set(spots.map(s => s.area))];
    areas.forEach(a => {
        const option = document.createElement('option');
        option.value = a;
        areaList.appendChild(option);
    });
    spots.forEach(s => {
        const option = document.createElement('option');
        option.value = s.spot;
        spotList.appendChild(option);
    });
}

// 魚種保存
function saveFishName(name){
    let fishes = JSON.parse(localStorage.getItem('fishNames')) || [];
    if(!fishes.includes(name)){
        fishes.push(name);
        localStorage.setItem('fishNames', JSON.stringify(fishes));
    }
    loadFishList();
    loadGraphFishList();
}

// 魚種読込
function loadFishList(){
    const fishList = document.getElementById('fishList');
    fishList.innerHTML = '';
    const fishes = JSON.parse(localStorage.getItem('fishNames')) || [];
    fishes.forEach(f => {
        const option = document.createElement('option');
        option.value = f;
        fishList.appendChild(option);
    });
}

// グラフ魚種読込
function loadGraphFishList(){
    const select = document.getElementById('graphFish');
    const currentValue = select.value;
    select.innerHTML = '<option value="">選択してください</option>';
    const fishes = JSON.parse(localStorage.getItem('fishNames')) || [];
    fishes.forEach(f => {
        const option = document.createElement('option');
        option.value = f;
        option.textContent = f;
        select.appendChild(option);
    });
    select.value = currentValue;
}

// 潮保存
function saveTideDay(){
    const date = document.getElementById('tideDate').value;
    const tideType = document.getElementById('dayTideType').value;
    const area = document.getElementById('areaInput').value;
    const spot = document.getElementById('spotInput').value;
    if(!date || !area || !spot){
        alert('入力してください');
        return;
    }
    saveSpot(area,spot);
    const rows = document.querySelectorAll('#tideTable tr');
    const tides = [];
    rows.forEach(row => {
        const type = row.querySelector('select').value;
        const time = row.querySelector('input').value;
        if(time){
            tides.push({ type, time });
        }
    });
    tides.sort((a,b)=> timeToMin(a.time) - timeToMin(b.time));
    localStorage.setItem('currentTide', JSON.stringify({ date, tideType, area, spot, tides }));
    alert('潮を保存しました');
}

// 潮復元
function restoreCurrentTide(){
    const current = JSON.parse(localStorage.getItem('currentTide'));
    if(!current) return;
    document.getElementById('tideDate').value = current.date;
    document.getElementById('dayTideType').value = current.tideType || '中潮';
    document.getElementById('areaInput').value = current.area;
    document.getElementById('spotInput').value = current.spot;
    const rows = document.querySelectorAll('#tideTable tr');
    rows.forEach(row => { row.querySelector('input').value = ''; });
    current.tides.forEach((tide,index)=>{
        if(rows[index]){
            rows[index].querySelector('select').value = tide.type;
            rows[index].querySelector('input').value = tide.time;
        }
    });
}

// 12分率計算ロジック
function calcTideLabel(prev,next,fishMin){
    let prevMin = timeToMin(prev.time);
    let nextMin = timeToMin(next.time);
    if(nextMin < prevMin) nextMin += 1440;
    let targetMin = fishMin;
    if(targetMin < prevMin) targetMin += 1440;

    const total = nextMin - prevMin;
    const elapsed = targetMin - prevMin;
    const progress = elapsed / total;

    const weights = [1,2,3,3,2,1];
    let currentWeight = 0;
    let phase = 0;

    for(let i=0;i<weights.length;i++){
        const section = weights[i] / 12;
        if(progress < currentWeight + section){
            const localRatio = (progress - currentWeight) / section;
            phase = (i + localRatio) / 6;
            break;
        }
        currentWeight += section;
    }

    let tideLevel = Math.floor(phase * 10);
    if(tideLevel < 0) tideLevel = 0;
    if(tideLevel > 10) tideLevel = 10;

    if(prev.type === '満潮'){
        const remain = 10 - tideLevel;
        if(remain <= 0 || remain >= 10) return '潮止まり';
        return `下げ${remain}分`;
    } else {
        if(tideLevel <= 0 || tideLevel >= 10) return '潮止まり';
        return `上げ${tideLevel}分`;
    }
}

// 釣果保存
function saveFish(){
    const current = JSON.parse(localStorage.getItem('currentTide'));
    if(!current || !current.tides || current.tides.length < 2){
        alert('先に潮を登録してください');
        return;
    }
    const fishTime = document.getElementById('fishTime').value;
    const fishName = document.getElementById('fishName').value;
    const fishSize = document.getElementById('fishSize').value;
    if(!fishTime || !fishName){
        alert('入力してください');
        return;
    }
    saveFishName(fishName);
    const fishMin = timeToMin(fishTime);
    const tides = [...current.tides].sort((a,b)=> timeToMin(a.time) - timeToMin(b.time));
    let tideLabel = '判定不可';

    for(let i=0;i<tides.length-1;i++){
        let start = timeToMin(tides[i].time);
        let end = timeToMin(tides[i+1].time);
        let target = fishMin;
        if(end < start) end += 1440;
        if(target < start) target += 1440;

        if(target >= start && target <= end){
            tideLabel = calcTideLabel(tides[i], tides[i+1], fishMin);
            break;
        }
    }

    let records = JSON.parse(localStorage.getItem('fishRecords')) || [];
    records.push({
        date: current.date,
        tideType: current.tideType,
        area: current.area,
        spot: current.spot,
        fish: fishName,
        size: fishSize,
        time: fishTime,
        tide: tideLabel
    });
    localStorage.setItem('fishRecords', JSON.stringify(records));
    loadFish();
    drawGraph();
    document.getElementById('fishTime').value = '';
    document.getElementById('fishSize').value = '';
}

// 削除
function deleteFish(index){
    if(!confirm('削除しますか？')) return;
    let records = JSON.parse(localStorage.getItem('fishRecords')) || [];
    records.splice(index,1);
    localStorage.setItem('fishRecords', JSON.stringify(records));
    loadFish();
    drawGraph();
}

// 一覧読込
function loadFish(){
    const body = document.getElementById('fishBody');
    body.innerHTML = '';
    const records = JSON.parse(localStorage.getItem('fishRecords')) || [];
    [...records].reverse().slice(0,50).forEach((r,reverseIndex)=>{
        const index = records.length - 1 - reverseIndex;
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${r.time}</td>
            <td>${r.fish}</td>
            <td>${r.size || '-'}</td>
            <td>${r.tide}</td>
            <td>${r.tideType || '-'}</td>
            <td><button class="delete-btn" onclick="deleteFish(${index})">❌</button></td>
        `;
        body.appendChild(tr);
    });
    createSummary(records);
}

// 集計
// 潮回り特性を「上げ3分」「下げ7分」以外にも、独自の歪みに気づけるようフラットに集計
function createSummary(records){
    const area = document.getElementById('summaryArea');
    area.innerHTML = '';
    const grouped = {};

    records.forEach(r => {
        const key = `${r.area} / ${r.spot} / ${r.fish}`;
        if(!grouped[key]) grouped[key] = {};
        if(!grouped[key][r.tide]) grouped[key][r.tide] = 0;
        grouped[key][r.tide]++;
    });

    for(const key in grouped){
        const title = document.createElement('h3');
        title.className = 'section-title';
        title.textContent = key;
        area.appendChild(title);

        const table = document.createElement('table');
        table.innerHTML = `<thead><tr><th>潮</th><th>件数</th></tr></thead>`;
        const tbody = document.createElement('tbody');
        const tides = grouped[key];

        for(const tide in tides){
            const tr = document.createElement('tr');
            // 一般論の「上げ3・下げ7」にハイライトを当てつつ、それ以外に山ができた時の「ブレ」を際立たせる
            if(tide === '上げ3分' || tide === '下げ7分'){
                tr.className = 'good';
            }
            tr.innerHTML = `<td>${tide}</td><td>${tides[tide]}</td>`;
            tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        area.appendChild(table);
    }
}

// グラフ描画（潮止まり対応版）
function drawGraph(){
    const fish = document.getElementById('graphFish').value;
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(!fish) return;

    const records = JSON.parse(localStorage.getItem('fishRecords')) || [];

    // ラベル配列の先頭に「潮止まり」を追加
    const labels = [
        '潮止まり',
        '上げ1分','上げ2分','上げ3分','上げ4分','上げ5分','上げ6分','上げ7分','上げ8分','上げ9分',
        '下げ1分','下げ2分','下げ3分','下げ4分','下げ5分','下げ6分','下げ7分','下げ8分','下げ9分'
    ];

    const counts = {};
    labels.forEach(l => { counts[l] = 0; });

    records.forEach(r => {
        if(r.fish === fish && counts[r.fish] !== undefined) {
            // 前方互換・スペルミスガード
        }
        if(r.fish === fish && counts[r.tide] !== undefined){
            counts[r.tide]++;
        }
    });

    const values = labels.map(l => counts[l]);
    const max = Math.max(...values, 1);

    const barWidth = 24;
    const gap = 11;
    const startX = 50;

    labels.forEach((label,index)=>{
        const value = values[index];
        const height = (value / max) * 180;
        const x = startX + index * (barWidth + gap);
        const y = 220 - height;

        // バーの描画
        ctx.fillStyle = '#3182ce';
        ctx.fillRect(x, y, barWidth, height);

        // 件数の表示
        ctx.fillStyle = '#333';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(value, x + barWidth/2, y - 5);

        // ラベルの描画（文字数が多いので少し斜めにして重なりを防ぐ）
        ctx.save();
        ctx.translate(x + barWidth/2, 235);
        ctx.rotate(Math.PI / 4); // 45度回転
        ctx.textAlign = 'left';
        ctx.fillText(label, 0, 0);
        ctx.restore();
    });
}

// 起動時処理
restoreCurrentTide();
loadFish();
loadSpotList();
loadFishList();
loadGraphFishList();
				</script>
</body>
