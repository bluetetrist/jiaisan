				<script>
					function timeToMin(time){

    if(!time){
        return 0;
    }

    const [h,m] =
        time.split(':').map(Number);

    return h * 60 + m;
}

function saveSpot(spot){

    let spots =
        JSON.parse(
            localStorage.getItem('spots')
        ) || [];

    if(!spots.includes(spot)){

        spots.push(spot);

        localStorage.setItem(
            'spots',
            JSON.stringify(spots)
        );
    }

    loadSpotList();
}

function loadSpotList(){

    const list =
        document.getElementById('spotList');

    const graph =
        document.getElementById('graphSpot');

    list.innerHTML='';
    graph.innerHTML=
        '<option value="">選択してください</option>';

    const spots =
        JSON.parse(
            localStorage.getItem('spots')
        ) || [];

    spots.forEach(spot=>{

        const option =
            document.createElement('option');

        option.value = spot;

        list.appendChild(option);

        const graphOption =
            document.createElement('option');

        graphOption.value = spot;
        graphOption.textContent = spot;

        graph.appendChild(graphOption);

    });
}// ======================
// 潮保存
// ======================

function saveTideDay(){

const date =
document.getElementById('tideDate').value;

const spot =
document.getElementById('spotInput').value;

const tideType =
document.getElementById('tideType').value;

if(!date || !spot){

alert('日付とスポットを入力してください');
return;
}

saveSpot(spot);

const rows =
document.querySelectorAll('#tideTable tr');

const tides = [];

rows.forEach(row=>{

const type =
row.querySelector('select').value;

const time =
row.querySelector('input').value;

if(time){

tides.push({
type,
time
});
}

});

tides.sort(
(a,b)=>
timeToMin(a.time)
- timeToMin(b.time)
);

localStorage.setItem(
'currentTide',
JSON.stringify({
date,
spot,
tideType,
tides
})
);

alert('保存しました');
}

// ======================
// 潮復元
// ======================

function restoreCurrentTide(){

const current =
JSON.parse(
localStorage.getItem('currentTide')
);

if(!current){
return;
}

document.getElementById('tideDate').value =
current.date || '';

document.getElementById('spotInput').value =
current.spot || '';

document.getElementById('tideType').value =
current.tideType || '中潮';

const rows =
document.querySelectorAll('#tideTable tr');

rows.forEach(row=>{

row.querySelector('input').value='';
});

current.tides.forEach((tide,index)=>{

if(rows[index]){

rows[index]
.querySelector('select')
.value = tide.type;

rows[index]
.querySelector('input')
.value = tide.time;
}

});
}

// ======================
// 潮位判定
// ======================

function calcTideLabel(
prev,
next,
fishMin
){

let prevMin =
timeToMin(prev.time);

let nextMin =
timeToMin(next.time);

if(nextMin < prevMin){ nextMin +=1440; } let target=fishMin; if(target < prevMin){ target +=1440; } const total=nextMin
	- prevMin; const elapsed=target - prevMin; let progress=elapsed / total; if(progress < 0){ progress=0; }
	if(progress> 1){
	progress = 1;
	}

	const level =
	Math.max(
	1,
	Math.min(
	9,
	Math.floor(progress * 10)
	)
	);

	if(prev.type === '干潮'){

	return `上げ${level}分`;
	}

	return `下げ${10-level}分`;
	}

	// ======================
	// 釣果登録
	// ======================

	function saveFish(){

	const current =
	JSON.parse(
	localStorage.getItem('currentTide')
	);

	if(
	!current ||
	!current.tides ||
	current.tides.length < 2 ){ alert( '先に潮を保存してください' ); return; } const
		fishTime=document.getElementById('fishTime').value; if(!fishTime){ alert('時間を入力してください'); return; } const
		fishMin=timeToMin(fishTime); const tides=[...current.tides]; let tideLabel='判定不可' ; for( let i=0;
		i<tides.length-1; i++ ){ let start=timeToMin( tides[i].time ); let end=timeToMin( tides[i+1].time ); let
		target=fishMin; if(end < start){ end +=1440; } if(target < start){ target +=1440; } if( target>= start &&
		target <= end ){ tideLabel=calcTideLabel( tides[i], tides[i+1], fishMin ); break; } } let records=JSON.parse(
			localStorage.getItem( 'fishRecords' ) ) || []; records.push({ date: current.date, spot: current.spot,
			tideType: current.tideType, time: fishTime, tide: tideLabel }); localStorage.setItem( 'fishRecords' ,
			JSON.stringify(records) ); document.getElementById( 'fishTime' ).value='' ; loadFish(); drawSpotGraph();
			drawTideGraph(); }// ======================
// 個別削除
// ======================

function deleteFish(index){

    if(!confirm('削除しますか？')){
        return;
    }

    let records =
        JSON.parse(
            localStorage.getItem('fishRecords')
        ) || [];

    records.splice(index,1);

    localStorage.setItem(
        'fishRecords',
        JSON.stringify(records)
    );

    loadFish();
    drawSpotGraph();
    drawTideGraph();
}

// ======================
// 一覧表示
// ======================

function loadFish(){

    const body =
        document.getElementById('fishBody');

    body.innerHTML='';

    const records =
        JSON.parse(
            localStorage.getItem('fishRecords')
        ) || [];

    [...records]
        .reverse()
        .forEach((r,reverseIndex)=>{

        const index =
            records.length-1-reverseIndex;

        const tr =
            document.createElement('tr');

        tr.innerHTML = `
        <td>${r.date}</td>
        <td>${r.spot}</td>
        <td>${r.time}</td>
        <td>${r.tide}</td>
        <td>${r.tideType}</td>
        <td>
            <button
                class="delete-btn"
                onclick="deleteFish(${index})">
                ❌
            </button>
        </td>
        `;

        body.appendChild(tr);

    });

}

// ======================
// スポット別グラフ
// ======================

function drawSpotGraph(){

    const spot =
        document.getElementById('graphSpot').value;

    const canvas =
        document.getElementById('spotCanvas');

    const ctx =
        canvas.getContext('2d');

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(!spot){
        return;
    }

    const records =
        JSON.parse(
            localStorage.getItem('fishRecords')
        ) || [];

    const labels = [

        '上げ1分',
        '上げ2分',
        '上げ3分',
        '上げ4分',
        '上げ5分',
        '上げ6分',
        '上げ7分',
        '上げ8分',
        '上げ9分',

        '下げ9分',
        '下げ8分',
        '下げ7分',
        '下げ6分',
        '下げ5分',
        '下げ4分',
        '下げ3分',
        '下げ2分',
        '下げ1分'

    ];

    const counts =
        new Array(18).fill(0);
const spot =
document.getElementById('graphSpot').value;

if(!spot){
return;
}
    records.forEach(r=>{

        if(r.spot !== spot){
            return;
        }

        let index = -1;

        if(r.tide.includes('上げ')){

            const n =
                parseInt(
                    r.tide.replace('上げ','')
                );

            index = n-1;
        }

        if(r.tide.includes('下げ')){

            const n =
                parseInt(
                    r.tide.replace('下げ','')
                );

            index = 18-n;
        }

        if(index >=0){

            counts[index]++;
        }

    });

    drawBarChart(
        ctx,
        canvas,
        labels,
        counts,
        spot + ' 時合分析'
    );

}

// ======================
// 潮回り分析
// ======================

function drawTideGraph(){

    const canvas =
        document.getElementById('tideCanvas');

    const ctx =
        canvas.getContext('2d');

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const records =
        JSON.parse(
            localStorage.getItem('fishRecords')
        ) || [];

    const labels = [
        '大潮',
        '中潮',
        '小潮',
        '長潮',
        '若潮'
    ];

    const counts = [
        0,0,0,0,0
    ];

	records.forEach(r=>{
	
	if(r.spot !== spot){
	return;
	}
	
	const index =
	labels.indexOf(r.tideType);
	
	if(index >= 0){
	
	counts[index]++;
	
	}

    drawBarChart(
        ctx,
        canvas,
        labels,
        counts,
spot + '潮回り分析'
    );

}

// ======================
// 共通棒グラフ
// ======================

function drawBarChart(
    ctx,
    canvas,
    labels,
    counts,
    title
){

    const max =
        Math.max(...counts,1);

    ctx.fillStyle='#000';

    ctx.font='20px sans-serif';

    ctx.fillText(
        title,
        20,
        30
    );

    const startX = 70;
    const baseY = 420;
    const graphH = 300;
    const barW = 30;
    const gap = 20;

    ctx.beginPath();
    ctx.moveTo(startX,80);
    ctx.lineTo(startX,baseY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(startX,baseY);
    ctx.lineTo(
        canvas.width-30,
        baseY
    );
    ctx.stroke();

    labels.forEach((label,i)=>{

        const h =
            counts[i] / max * graphH;

        const x =
            startX + 20 +
            i*(barW+gap);

        ctx.fillStyle='#2b6cb0';

        ctx.fillRect(
            x,
            baseY-h,
            barW,
            h
        );

        ctx.fillStyle='#000';

        ctx.fillText(
            counts[i],
            x,
            baseY-h-5
        );

        ctx.save();

        ctx.translate(
            x,
            baseY+20
        );

        ctx.rotate(
            -Math.PI/4
        );

        ctx.fillText(
            label,
            0,
            0
        );

        ctx.restore();

    });

}

// ======================
// バックアップ
// ======================

function backupData(){

    const data = {

        currentTide:
            JSON.parse(
                localStorage.getItem('currentTide')
            ),

        fishRecords:
            JSON.parse(
                localStorage.getItem('fishRecords')
            ) || [],

        spots:
            JSON.parse(
                localStorage.getItem('spots')
            ) || []

    };

    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:'application/json'
            }
        );

    const a =
        document.createElement('a');

    a.href =
        URL.createObjectURL(blob);

    a.download =
        'jiaisan_backup.json';

    a.click();
}

// ======================
// 復元
// ======================

function restoreData(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload = function(e){

        const data =
            JSON.parse(
                e.target.result
            );

        localStorage.setItem(
            'currentTide',
            JSON.stringify(
                data.currentTide
            )
        );

        localStorage.setItem(
            'fishRecords',
            JSON.stringify(
                data.fishRecords
            )
        );

        localStorage.setItem(
            'spots',
            JSON.stringify(
                data.spots
            )
        );

        alert('復元完了');

        location.reload();

    };

    reader.readAsText(file);

}

// ======================
// 全削除
// ======================

function deleteAllData(){

    if(
        !confirm(
            '全データ削除しますか？'
        )
    ){
        return;
    }

    localStorage.removeItem(
        'currentTide'
    );

    localStorage.removeItem(
        'fishRecords'
    );

    localStorage.removeItem(
        'spots'
    );

    location.reload();
}

// ======================
// 起動
// ======================

restoreCurrentTide();

loadSpotList();

loadFish();

drawTideGraph();
